apiVersion: 1

datasources:
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://SEU_SERVIDOR_INTERNO
    isDefault: false
    editable: true
    jsonData:
      trends: true
      trendsFrom: "7d"
      trendsRange: "4d"
      cacheTTL: "1m"
      timeout: "30"
      alerting: true
      addThresholds: false
      alertingMinSeverity: 3
      dbConnectionEnable: false
    secureJsonData:
      username: ${ZABBIX_USER}
      password: ${ZABBIX_PASSWORD}
