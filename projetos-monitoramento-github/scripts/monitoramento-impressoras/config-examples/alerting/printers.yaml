apiVersion: 1

groups:
  - orgId: 1
    name: Impressoras
    folder: Impressoras
    interval: 1m
    rules:
      - uid: printer-offline
        title: Impressora offline
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Impressora sem resposta ICMP/SNMP
        labels:
          severity: critical
          service: printers
        data:
          - refId: A
            datasourceUid: zabbix
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: alexanderzobnin-zabbix-datasource
                uid: zabbix
              group:
                filter: /.*/
              host:
                filter: /.*/
              item:
                filter: /(?i)(icmpping|icmp ping|snmp.*availability|availability|agent.ping|status)/
              queryType: 0
              resultFormat: time_series
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              refId: C
      - uid: printer-toner-low
        title: Toner baixo
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: Toner abaixo de 20%
        labels:
          severity: warning
          service: printers
        data:
          - refId: A
            datasourceUid: zabbix
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: alexanderzobnin-zabbix-datasource
                uid: zabbix
              group:
                filter: /.*/
              host:
                filter: /.*/
              item:
                filter: /(?i)(toner|supply|cartridge).*(black|preto|cyan|magenta|yellow|amarelo|%)/
              queryType: 0
              resultFormat: time_series
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [20]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              refId: C
      - uid: printer-snmp-communication
        title: Sem comunicacao SNMP
        condition: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: Zabbix nao recebeu metricas SNMP recentes da impressora
        labels:
          severity: critical
          service: printers
        data:
          - refId: A
            datasourceUid: zabbix
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: alexanderzobnin-zabbix-datasource
                uid: zabbix
              group:
                filter: /.*/
              host:
                filter: /.*/
              item:
                filter: /(?i)(snmp.*available|snmp.*availability|snmp.*error|unavailable|timeout)/
              queryType: 0
              resultFormat: time_series
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              refId: C
      - uid: printer-critical-error
        title: Erro critico de impressora
        condition: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: Impressora reportou papel atolado, sem papel, tampa aberta ou erro critico
        labels:
          severity: critical
          service: printers
        data:
          - refId: A
            datasourceUid: zabbix
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: alexanderzobnin-zabbix-datasource
                uid: zabbix
              group:
                filter: /.*/
              host:
                filter: /.*/
              item:
                filter: /(?i)(jam|atolado|paper.*out|sem papel|cover|tampa|critical|error|erro|fault|falha)/
              queryType: 0
              resultFormat: time_series
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              refId: C
